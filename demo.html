<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>held fish indicator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Maru+Gothic:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{ --paper:#f2efe6; --ink:#1c1b18; }
      *{ margin:0; padding:0; box-sizing:border-box; }
      body{
        min-height:100vh;
        background:
          radial-gradient(140% 100% at 30% 20%, rgba(255,255,255,.55), transparent 60%),
          var(--paper);
        font-family:'Zen Maru Gothic',sans-serif;
        color:var(--ink);
        display:grid; place-items:center;
      }
      .wrap{ display:flex; gap:60px; padding:40px; flex-wrap:wrap; justify-content:center; }
      .pane{ text-align:center; }
      canvas{ display:block; }
      .lbl{
        font-size:10px; letter-spacing:.42em; text-transform:uppercase;
        color:rgba(28,27,24,.68); margin-top:10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="pane"><canvas id="c1" width="340" height="280"></canvas><div class="lbl">i · brackets</div></div>
      <div class="pane"><canvas id="c2" width="340" height="280"></canvas><div class="lbl">ii · shadow</div></div>
      <div class="pane"><canvas id="c3" width="340" height="280"></canvas><div class="lbl">iii · halo</div></div>
    </div>
    <script>
      const P1 = new Path2D('M310 100 Q180 10 30 148');
      const P2 = new Path2D('M310 100 Q180 190 30 52');
      const LEN = 150, VW = 340, VH = 200;

      const drawFish = (ctx, cx, cy, t, inkAlpha) => {
        const sc = LEN / VW;
        const amp = 0.95 * VH * 0.075;
        const slices = 18, sw = VW / slices;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sc, sc);
        ctx.translate(-VW / 2, -VH / 2);
        ctx.lineWidth = 1.55 / sc;
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(28,27,24,' + inkAlpha + ')';
        for (let i = 0; i < slices; i++) {
          const x0 = i * sw;
          const u = (x0 + sw / 2) / VW;
          const env = Math.pow(1 - u, 1.5) * 0.9 + 0.06;
          const dy = amp * env * Math.sin(t * 2 * Math.PI * 2.3 + u * 5.4);
          ctx.save();
          ctx.beginPath();
          ctx.rect(x0 - 0.25, -VH * 0.6, sw + 0.5, VH * 2.2);
          ctx.clip();
          ctx.translate(0, dy);
          ctx.stroke(P1);
          ctx.stroke(P2);
          ctx.restore();
        }
        ctx.restore();
      };

      const c1 = document.getElementById('c1').getContext('2d');
      const c2 = document.getElementById('c2').getContext('2d');
      const c3 = document.getElementById('c3').getContext('2d');
      const CX = 170, CY = 130, R = LEN * 0.62;

      const brackets = (ctx, t) => {
        const b = R * (1 + Math.sin(t * 2.6) * 0.03);
        const a = b * 0.72, k = 14;
        ctx.strokeStyle = 'rgba(28,27,24,.55)';
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(CX - a, CY - a + k); ctx.lineTo(CX - a, CY - a); ctx.lineTo(CX - a + k, CY - a);
        ctx.moveTo(CX + a - k, CY - a); ctx.lineTo(CX + a, CY - a); ctx.lineTo(CX + a, CY - a + k);
        ctx.moveTo(CX + a, CY + a - k); ctx.lineTo(CX + a, CY + a); ctx.lineTo(CX + a - k, CY + a);
        ctx.moveTo(CX - a + k, CY + a); ctx.lineTo(CX - a, CY + a); ctx.lineTo(CX - a, CY + a - k);
        ctx.stroke();
      };

      const shadow = ctx => {
        const g = ctx.createRadialGradient(CX, CY + 52, 4, CX, CY + 52, LEN * 0.5);
        g.addColorStop(0, 'rgba(28,27,24,.16)');
        g.addColorStop(1, 'rgba(28,27,24,0)');
        ctx.fillStyle = g;
        ctx.save();
        ctx.translate(CX, CY + 52);
        ctx.scale(1, 0.22);
        ctx.translate(-CX, -(CY + 52));
        ctx.beginPath();
        ctx.arc(CX, CY + 52, LEN * 0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      };

      const halo = (ctx, t) => {
        ctx.strokeStyle = 'rgba(28,27,24,.5)';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([2, 7]);
        ctx.lineDashOffset = -t * 12;
        ctx.beginPath();
        ctx.arc(CX, CY, R, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      };

      let start;
      const loop = ts => {
        requestAnimationFrame(loop);
        if (!start) start = ts;
        const t = (ts - start) / 1000;
        c1.clearRect(0, 0, 340, 280);
        brackets(c1, t);
        drawFish(c1, CX, CY, t, 0.92);
        c2.clearRect(0, 0, 340, 280);
        shadow(c2);
        drawFish(c2, CX, CY, t, 1);
        c3.clearRect(0, 0, 340, 280);
        halo(c3, t);
        drawFish(c3, CX, CY, t, 0.92);
      };
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
