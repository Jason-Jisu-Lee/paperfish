<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>movement chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:rgba(255,255,255,.82);font:13px/1.5 ui-monospace,Consolas,monospace;padding:36px;max-width:920px}
h1{font-size:15px;letter-spacing:.1em;text-transform:lowercase;opacity:.6;margin-bottom:4px;font-weight:600}
.sub{opacity:.4;font-size:11px;margin-bottom:28px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;margin:30px 0 10px;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:6px}
table{width:100%;border-collapse:collapse;margin-bottom:6px}
td{padding:5px 10px 5px 0;vertical-align:top}
td.k{color:#9fd0ff;white-space:nowrap;width:230px}
td.v{color:#fff;font-weight:600;white-space:nowrap;width:150px}
td.d{opacity:.55}
.plain{opacity:.75;font-size:12.5px;margin:2px 0 16px;max-width:760px}
.note{opacity:.4;font-size:11px;margin-top:40px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
</style>
</head>
<body>
<h1>fish movement chart</h1>
<div class="sub">reads js/movement-config.js live — this always matches what's actually running. ask to change any row by name.</div>

<div id="out"></div>

<div class="note">to edit: say the row name (left column) and the new value or range. this file is the only place movement numbers live.</div>

<script src="js/util.js?v=1"></script>
<script src="js/movement-config.js?v=3"></script>
<script>
const SECTIONS = [
  { title: 'cruise leg (default speed while traveling to a target)', plain: 'Most legs. Speed is picked once per leg and held for the whole trip.', rows: [
    ['cruiseMulMin / cruiseMulMax', MOVE.cruiseMulMin + ' – ' + MOVE.cruiseMulMax, 'speed multiplier on species base speed'],
    ['cruiseChance', MOVE.cruiseChance, 'probability a new leg is cruise-paced'],
  ]},
  { title: 'brisk leg (a faster-than-normal cruise)', plain: 'Occasional quicker legs, not a full dash.', rows: [
    ['briskMulMin / briskMulMax', MOVE.briskMulMin + ' – ' + MOVE.briskMulMax, 'speed multiplier'],
    ['briskChance', MOVE.briskChance, 'probability a new leg is brisk'],
  ]},
  { title: 'rest (staying mostly still)', plain: 'Fish barely drifts, hovering near one spot, refreshing a tiny hover point every 1.2–2.4s. Duration is either short or — sometimes — much longer.', rows: [
    ['restMulMin / restMulMax', MOVE.restMulMin + ' – ' + MOVE.restMulMax, 'speed multiplier while resting'],
    ['restChance', MOVE.restChance, 'probability of resting after finishing a leg (vs starting a new one)'],
    ['restShortMin / restShortMax', MOVE.restShortMin + 's – ' + MOVE.restShortMax + 's', 'short rest duration range'],
    ['restLongMin / restLongMax', MOVE.restLongMin + 's – ' + MOVE.restLongMax + 's', 'long rest duration range'],
    ['restLongChance', MOVE.restLongChance, 'probability a rest is the long version'],
  ]},
  { title: 'dash (rare fast burst)', plain: 'Independent per-fish timer, unrelated to cruise/brisk/rest. Interrupts whatever the fish was doing, picks a far target, bursts bubbles, then resumes normal legs.', rows: [
    ['dashIntervalMin / dashIntervalMax', MOVE.dashIntervalMin + 's – ' + MOVE.dashIntervalMax + 's', 'time between dashes, per fish'],
    ['dashMulMin / dashMulMax', MOVE.dashMulMin + ' – ' + MOVE.dashMulMax, 'speed multiplier during dash'],
    ['dashShortMin / dashShortMax', MOVE.dashShortMin + 's – ' + MOVE.dashShortMax + 's', 'short dash duration range'],
    ['dashLongMin / dashLongMax', MOVE.dashLongMin + 's – ' + MOVE.dashLongMax + 's', 'long dash duration range ("quick for longer")'],
    ['dashLongChance', MOVE.dashLongChance, 'probability a dash is the long version'],
  ]},
  { title: 'arrival (slowing down near the target)', plain: 'A fish commits to its target and keeps going at leg speed. Only in the final stretch does it decelerate — matching "stop 70–95% close to the end."', rows: [
    ['arriveSlowStart', (MOVE.arriveSlowStart*100).toFixed(0) + '%', 'fraction of the leg where slowdown begins'],
    ['arriveSlowEnd', (MOVE.arriveSlowEnd*100).toFixed(0) + '%', 'fraction where it reaches minimum speed'],
    ['arriveSlowFloor', MOVE.arriveSlowFloor, 'speed multiplier floor at the very end (fraction of leg speed)'],
  ]},
  { title: 'turning', plain: 'How fast heading catches up to the target direction.', rows: [
    ['turnEaseNormal', MOVE.turnEaseNormal, 'normal turn responsiveness'],
    ['turnEaseSlow', MOVE.turnEaseSlow, 'turn responsiveness while resting or in the arrival slowdown'],
    ['turnEaseLeave', MOVE.turnEaseLeave, 'turn responsiveness when a fish is spent/leaving the tank'],
    ['bigReversalThresholdRad', MOVE.bigReversalThresholdRad, 'heading-change size (radians) that counts as a big reversal'],
    ['bigReversalBoost', MOVE.bigReversalBoost, 'turn-speed multiplier applied during a big reversal'],
  ]},
  { title: 'wander target angle (how vertical a new target may be)', plain: 'Most legs stay close to horizontal. A rare, deliberate steep target ("diving") is allowed and moves faster while it lasts.', rows: [
    ['normalMaxAngleDeg', MOVE.normalMaxAngleDeg + '°', 'normal target: max angle from horizontal'],
    ['diveChance', MOVE.diveChance, 'probability a new target is a deliberate dive'],
    ['diveMinAngleDeg / diveMaxAngleDeg', MOVE.diveMinAngleDeg + '° – ' + MOVE.diveMaxAngleDeg + '°', 'dive target angle range'],
    ['diveSpeedMul', MOVE.diveSpeedMul, 'extra speed multiplier while diving'],
    ['dashTargetMaxAngleDeg', MOVE.dashTargetMaxAngleDeg + '°', 'max angle for a dash target (dash ignores the normal cap but is still bounded)'],
  ]},
  { title: 'body bend (visual only, does not affect actual movement)', plain: 'A shear, not a rotation — front and back of the body lean opposite ways, like a real fish flexing. Scales with how vertical the current heading is, eased slowly.', rows: [
    ['bendMaxDeg', MOVE.bendMaxDeg + '°', 'maximum visual bend, reached only near-vertical headings'],
    ['bendEase', MOVE.bendEase, 'how quickly the bend eases toward its target (higher = faster)'],
  ]},
  { title: 'special states', plain: 'Breeding approach and being spent/released are not tunable per-mood — fixed multipliers.', rows: [
    ['pairtoMul', MOVE.pairtoMul, 'speed multiplier while approaching a breeding partner'],
    ['leaveMulMin / leaveMulMax', MOVE.leaveMulMin + ' – ' + MOVE.leaveMulMax, 'speed multiplier when spent/leaving the tank'],
  ]},
];

const out = document.getElementById('out');
for (const sec of SECTIONS) {
  const h2 = document.createElement('h2');
  h2.textContent = sec.title;
  out.appendChild(h2);
  if (sec.plain) {
    const p = document.createElement('div');
    p.className = 'plain';
    p.textContent = sec.plain;
    out.appendChild(p);
  }
  const table = document.createElement('table');
  for (const [k, v, d] of sec.rows) {
    const tr = document.createElement('tr');
    const tdk = document.createElement('td'); tdk.className = 'k'; tdk.textContent = k;
    const tdv = document.createElement('td'); tdv.className = 'v'; tdv.textContent = v;
    const tdd = document.createElement('td'); tdd.className = 'd'; tdd.textContent = d;
    tr.append(tdk, tdv, tdd);
    table.appendChild(tr);
  }
  out.appendChild(table);
}
</script>
</body>
</html>
