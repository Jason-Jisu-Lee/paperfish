<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fish tiers</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:'Courier New',monospace; padding-bottom:60px; }
  h1{ font-size:15px; letter-spacing:.2em; font-weight:normal; text-align:center; margin:26px 0 4px; }
  .hint{ font-size:11px; letter-spacing:.08em; opacity:.55; text-align:center; margin-bottom:22px; }
  .tier{ max-width:860px; margin:0 auto 18px; padding:16px 26px; background:rgba(255,255,255,.5); border:1px solid rgba(28,27,24,.15); border-radius:12px; }
  .t-head{ display:flex; align-items:baseline; gap:14px; margin-bottom:12px; }
  .t-name{ font-size:13px; letter-spacing:.2em; }
  .t-note{ font-size:10.5px; opacity:.5; letter-spacing:.06em; }
  .row{ display:flex; gap:34px; flex-wrap:wrap; align-items:center; }
  .card{ text-align:center; }
  .card svg{ height:64px; overflow:visible; display:block; margin:0 auto; }
  .card path{ fill:none; stroke:rgba(28,27,24,.75); stroke-width:1.6; vector-effect:non-scaling-stroke; stroke-linecap:round; stroke-linejoin:round; }
  .card .dot{ fill:rgba(28,27,24,.75); }
  .nm{ font-size:11.5px; letter-spacing:.1em; margin-top:8px; }
  .ln{ font-size:9.5px; opacity:.45; letter-spacing:.08em; margin-top:2px; }
</style>
</head>
<body>
<h1>fish tiers · placeholder plan</h1>
<div class="hint">bigger, fancier, rarer climbs tiers · income / lifespan / odds per tier all TBD</div>
<div id="tiers"></div>
<script src="../data/species.js"></script>
<script>
const snailPath = (() => {
  let d = '';
  for (let i = 0; i <= 20; i++) {
    const q = i / 20, ang = q * Math.PI * 2.3;
    const r = 15 * (1 - q * 0.8);
    const x = 30 + Math.cos(ang) * r, y = 22 + Math.sin(ang) * r;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d;
})();
const SNAIL = {
  name: 'Snail', vb: [60, 46],
  paths: [snailPath, 'M14 41 Q30 46 54 38', 'M54 36 L60 24', 'M50 36 L54 24']
};
const TIERS = [
  { n: 1, note: 'the starters', fish: [0, 2] },
  { n: 2, note: 'small but characterful', fish: [1, 'snail'] },
  { n: 3, note: 'proper fish', fish: [3, 5] },
  { n: 4, note: 'broad and bold', fish: [4, 6] },
  { n: 5, note: 'hunters and curiosities', fish: [7, 10] },
  { n: 6, note: 'the deep and the rare', fish: [8, 9, 11] }
];
const card = f => {
  const sp = f === 'snail' ? SNAIL : SPECIES[f];
  let inner = sp.paths.map(d => `<path d="${d}"/>`).join('');
  if (sp.dots) inner += sp.dots.map(d => `<circle class="dot" cx="${d.cx}" cy="${d.cy}" r="${d.r}"/>`).join('');
  if (sp.mirror) inner = `<g transform="translate(${sp.vb[0]},0) scale(-1,1)">${inner}</g>`;
  const w = Math.round(64 * sp.vb[0] / sp.vb[1]);
  return `<div class="card"><svg viewBox="0 0 ${sp.vb[0]} ${sp.vb[1]}" style="width:${Math.min(w, 150)}px">${inner}</svg>
    <div class="nm">${sp.name}</div><div class="ln">income · life · odds TBD</div></div>`;
};
document.getElementById('tiers').innerHTML = TIERS.map(t => `
  <div class="tier">
    <div class="t-head"><span class="t-name">TIER ${t.n}</span><span class="t-note">${t.note}</span></div>
    <div class="row">${t.fish.map(card).join('')}</div>
  </div>`).join('');
</script>
</body>
</html>
