<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>egg visibility options</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:'Courier New',monospace; }
  h1{ font-size:15px; letter-spacing:.2em; font-weight:normal; text-align:center; margin:26px 0 6px; }
  .hint{ font-size:11px; letter-spacing:.08em; opacity:.55; text-align:center; margin-bottom:22px; }
  .row{ display:flex; justify-content:center; gap:20px; flex-wrap:wrap; padding:0 20px 46px; }
  .opt{ text-align:center; }
  .stagebox{
    width:300px; height:290px; position:relative;
    background:#f2efe6;
    box-shadow:inset 0 0 40px rgba(28,27,24,.05);
    border:1px solid rgba(28,27,24,.15); border-radius:4px;
    overflow:hidden;
  }
  .lab{ font-size:12px; letter-spacing:.12em; margin-top:10px; }
  .sub{ font-size:10.5px; opacity:.55; margin-top:4px; letter-spacing:.05em; max-width:300px; }
  svg{ position:absolute; inset:0; width:100%; height:100%; }
  .bgfish{ fill:none; stroke:rgba(28,27,24,.75); stroke-width:1.5; stroke-linecap:round; }
  .bgkelp{ fill:none; stroke:rgba(28,27,24,.42); stroke-width:2.1; stroke-linecap:round; }
  .bub{ fill:none; stroke:rgba(62,84,110,.28); stroke-width:1.1; }
  .eggline{ fill:none; stroke:rgba(28,27,24,.85); stroke-width:2.4; stroke-linecap:round; }
  .eggbob{ animation:bob 3s ease-in-out infinite; transform-origin:150px 150px; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-3px) } }
  .fill1{ fill:#fdfaf1; }
  .shadow{ filter:drop-shadow(0 2px 3px rgba(28,27,24,.22)); }
  .halo{ animation:haloglow 3s ease-in-out infinite; }
  @keyframes haloglow{ 0%,100%{ opacity:.75 } 50%{ opacity:1 } }
  .speck{ fill:rgba(180,58,43,.85); }

  .drawegg{
    stroke-dasharray:150;
    animation:drawon 4s ease infinite;
  }
  @keyframes drawon{
    0%{ stroke-dashoffset:150; opacity:0; }
    6%{ opacity:1; }
    34%{ stroke-dashoffset:0; }
    88%{ stroke-dashoffset:0; opacity:1; }
    100%{ stroke-dashoffset:0; opacity:0; }
  }
  .ripple{
    fill:none; stroke:rgba(28,27,24,.4); stroke-width:1.4;
    transform-origin:150px 150px;
    animation:rip 4s ease-out infinite;
  }
  .ripple.r2{ animation-delay:.25s; }
  @keyframes rip{
    0%{ transform:scale(.2); opacity:0; }
    4%{ opacity:.8; }
    30%{ transform:scale(1.55); opacity:0; }
    100%{ transform:scale(1.55); opacity:0; }
  }
</style>
</head>
<body>
<h1>egg visibility options</h1>
<div class="hint">same busy scene each panel · option 4 loops its spawn moment</div>
<div class="row" id="row"></div>
<script>
const EGG = 'M150,126 C162.5,126 168.3,140.4 168.3,152 C168.3,165.4 159.6,173 150,173 C140.4,173 131.7,165.4 131.7,152 C131.7,140.4 137.5,126 150,126';
const bg = `
  <path class="bgfish" d="M40 60 Q80 38 124 66 M40 60 Q80 84 124 52" opacity=".8"/>
  <path class="bgfish" d="M190 235 Q225 217 262 240 M190 235 Q225 255 262 228" opacity=".6"/>
  <path class="bgkelp" d="M243 88 C246 74 239 60 244 42 M243 88 C237 78 239 66 234 57 M243 88 C248 79 251 70 250 61"/>
  <circle class="bub" cx="62" cy="196" r="2.6"/>
  <circle class="bub" cx="70" cy="176" r="1.8"/>
  <circle class="bub" cx="57" cy="158" r="1.4"/>`;
const opts = [
  { lab: '1 · solid shell', sub: 'paper-white fill + soft shadow, reads as an object not a line',
    body: `<g class="eggbob shadow"><path class="eggline fill1" d="${EGG}"/></g>` },
  { lab: '2 · warm halo', sub: 'solid shell + faint lantern-style glow while unhatched',
    body: `<g class="halo"><circle cx="150" cy="150" r="44" fill="url(#hg)"/></g>
           <g class="eggbob"><path class="eggline fill1" d="${EGG}"/></g>` },
  { lab: '3 · hanko speck', sub: 'solid shell + one tiny seal-red dot, color identity',
    body: `<g class="eggbob shadow"><path class="eggline fill1" d="${EGG}"/><circle class="speck" cx="158" cy="136" r="2.6"/></g>` },
  { lab: '4 · spawn ritual', sub: 'egg draws itself on with an ink ripple, then settles (add to any of 1-3)',
    body: `<circle class="ripple" cx="150" cy="150" r="34"/>
           <circle class="ripple r2" cx="150" cy="150" r="34"/>
           <path class="eggline drawegg" d="${EGG}"/>` }
];
document.getElementById('row').innerHTML = opts.map(o => `
  <div class="opt">
    <div class="stagebox">
      <svg viewBox="0 0 300 290">
        <defs><radialGradient id="hg"><stop offset="0%" stop-color="rgba(190,150,40,.18)"/><stop offset="100%" stop-color="rgba(190,150,40,0)"/></radialGradient></defs>
        ${bg}${o.body}
      </svg>
    </div>
    <div class="lab">${o.lab}</div>
    <div class="sub">${o.sub}</div>
  </div>`).join('');
</script>
</body>
</html>
