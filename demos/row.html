<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>paperfish - the rowing</title>
<style>
  html, body { margin:0; height:100%; background:#f2efe6; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #again {
    position:fixed; left:50%; bottom:9%; transform:translateX(-50%);
    font:15px/1 Georgia, serif; letter-spacing:.35em; text-transform:lowercase;
    color:#f2efe6; background:none; border:1px solid rgba(242,239,230,.45);
    border-radius:999px; padding:12px 30px 12px 34px; cursor:pointer;
    opacity:0; transition:opacity 1.2s ease; pointer-events:none;
  }
  #again.on { opacity:1; pointer-events:auto; }
  #again:hover { border-color:#b43a2b; color:#b43a2b; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again">again</button>
<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const againBtn = document.getElementById('again');
const PAPER = '#f2efe6';
let W = 0, H = 0;
const fit = () => {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
};
addEventListener('resize', fit);
fit();

const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const S = (a, b, x) => { x = (x - a) / (b - a); x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
const L = (a, b, x) => a + (b - a) * x;
const qp = (p0, c, p1, u) => [
  (1 - u) * (1 - u) * p0[0] + 2 * u * (1 - u) * c[0] + u * u * p1[0],
  (1 - u) * (1 - u) * p0[1] + 2 * u * (1 - u) * c[1] + u * u * p1[1]
];

const DUR = 12;
const frozen = new URLSearchParams(location.search).get('t');
let t0 = performance.now();

const ink = a => `rgba(28,27,24,${a})`;
const pap = a => `rgba(242,239,230,${a})`;

const taper = (x0, y0, x1, y1, w0, w1, a, sag) => {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const mx = (x0 + x1) / 2 + nx * 0, my = (y0 + y1) / 2 + (sag || 0);
  cx.fillStyle = ink(a);
  cx.beginPath();
  cx.moveTo(x0 + nx * w0, y0 + ny * w0);
  cx.quadraticCurveTo(mx + nx * (w0 + w1) / 2, my + ny * (w0 + w1) / 2, x1 + nx * w1, y1 + ny * w1);
  cx.lineTo(x1 - nx * w1, y1 - ny * w1);
  cx.quadraticCurveTo(mx - nx * (w0 + w1) / 2, my - ny * (w0 + w1) / 2, x0 - nx * w0, y0 - ny * w0);
  cx.closePath();
  cx.fill();
};

const draw = t => {
  const cycle = 2.4;
  const ph = (t / cycle) % 1;
  const stroke = Math.floor(t / cycle);
  const drive = S(0.05, 0.18, ph) * (1 - S(0.4, 0.5, ph));
  const swell = S(6.9, 8.1, t);
  const fall = S(8.1, 8.9, t);
  const uw = S(8.8, 9.2, t);

  cx.fillStyle = PAPER;
  cx.fillRect(0, 0, W, H);

  const heave = (Math.sin(ph * Math.PI * 2 - 0.9) * H * 0.009 * (0.4 + drive) + Math.sin(t * 0.8) * H * 0.007) * (1 - fall);
  const roll = (Math.sin(t * 0.6) * 0.009 + Math.sin(ph * Math.PI * 2 - 1.7) * 0.006) * (1 - fall)
    + swell * 0.055 + fall * 0.55;
  const HY = L(H * 0.4, -H * 0.95, fall) + heave - swell * H * 0.1;

  cx.save();
  cx.translate(W / 2, H / 2);
  cx.rotate(roll);
  cx.translate(-W / 2, -H / 2);

  if (uw < 1) {
    for (let i = 0; i < 3; i++) {
      cx.fillStyle = ink(0.045);
      cx.beginPath();
      cx.ellipse(W * (0.2 + i * 0.31) + t * 2 * (i % 2 ? 1 : -1), HY - H * (0.13 + i * 0.09) + Math.sin(t * 0.12 + i * 2) * 8,
        W * 0.24, H * 0.02, 0, 0, 7);
      cx.fill();
    }
    cx.fillStyle = 'rgba(180,58,43,.85)';
    cx.beginPath();
    cx.arc(W * 0.72, HY - H * 0.16, H * 0.038, 0, 7);
    cx.fill();

    cx.fillStyle = ink(0.07);
    cx.fillRect(-W * 0.2, HY, W * 1.4, H * 2.2);
    cx.fillStyle = pap(0.5);
    cx.fillRect(-W * 0.2, HY, W * 1.4, H * 0.012);

    const adv = t * 0.052 + 0.018 * Math.sin(ph * Math.PI * 2 - 1.2);
    const bands = [];
    for (let i = 0; i < 34; i++) bands.push([((rnd(i) + adv * (0.7 + rnd(i + 40) * 0.6)) % 1), i]);
    bands.sort((a, b) => a[0] - b[0]);
    const foam = [];
    for (const [q, i] of bands) {
      const y = HY + Math.pow(q, 1.6) * (H * 1.15 - HY);
      const A = (2 + 17 * q) * (0.7 + rnd(i + 7) * 0.7);
      const al = (0.12 + 0.36 * q) * S(0, 0.07, q) * (1 - 0.45 * S(0.88, 1, q));
      const k1 = 0.013 - 0.006 * q, k2 = k1 * 2.1, k3 = k1 * 4.3;
      const s1 = rnd(i + 3) * 9, s2 = rnd(i + 11) * 9, s3 = rnd(i + 17) * 9;
      cx.strokeStyle = ink(al);
      cx.lineWidth = (0.8 + 4 * q) * (0.75 + rnd(i + 21) * 0.6);
      cx.lineCap = 'round';
      cx.beginPath();
      let first = true;
      for (let x = -W * 0.15; x <= W * 1.15; x += W * 0.016) {
        const s = 0.55 * Math.sin(x * k1 + t * 0.9 + s1)
          + 0.3 * Math.sin(-x * k2 + t * 0.6 + s2)
          + 0.15 * Math.sin(x * k3 + t * 1.7 + s3);
        const yy = y + A * s;
        first ? cx.moveTo(x, yy) : cx.lineTo(x, yy);
        first = false;
        if (s > 0.72 && q > 0.25 && Math.floor(x / (W * 0.016) + i) % 4 === 0) foam.push([x, yy, q]);
      }
      cx.stroke();
    }
    for (const [fx, fy, q] of foam) {
      cx.strokeStyle = pap(0.5 + q * 0.35);
      cx.lineWidth = 1.6 + q * 2;
      cx.beginPath();
      cx.moveTo(fx - 6 - q * 14, fy - 1.5);
      cx.lineTo(fx + 6 + q * 14, fy - 1.5);
      cx.stroke();
    }

    const bY = H * 1.04 + fall * H * 0.62;
    const tipY = bY - H * 0.31;
    const gl = [[-W * 0.12, bY], [W * 0.15, bY - H * 0.21], [W * 0.5, tipY]];
    const gr = [[W * 1.12, bY], [W * 0.85, bY - H * 0.21], [W * 0.5, tipY]];

    cx.fillStyle = 'rgba(233,228,214,.97)';
    cx.beginPath();
    cx.moveTo(gl[0][0], gl[0][1]);
    cx.quadraticCurveTo(gl[1][0], gl[1][1], gl[2][0], gl[2][1]);
    cx.quadraticCurveTo(gr[1][0], gr[1][1], gr[0][0], gr[0][1]);
    cx.lineTo(W * 1.12, H * 1.4);
    cx.lineTo(-W * 0.12, H * 1.4);
    cx.closePath();
    cx.fill();
    cx.fillStyle = ink(0.08);
    cx.fill();

    for (let j = 1; j <= 3; j++) {
      cx.strokeStyle = ink(0.22);
      cx.lineWidth = 1.5;
      cx.beginPath();
      cx.moveTo(L(gl[0][0], W * 0.36, j * 0.26), bY + 8);
      cx.quadraticCurveTo(L(gl[1][0], W * 0.42, j * 0.3), L(gl[1][1], bY - H * 0.1, j * 0.22), W * 0.5, tipY + j * H * 0.052);
      cx.quadraticCurveTo(L(gr[1][0], W * 0.58, j * 0.3), L(gr[1][1], bY - H * 0.1, j * 0.22), L(gr[0][0], W * 0.64, j * 0.26), bY + 8);
      cx.stroke();
    }

    for (const g of [gl, gr]) {
      cx.strokeStyle = ink(0.9);
      cx.lineWidth = H * 0.014;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(g[0][0], g[0][1]);
      cx.quadraticCurveTo(g[1][0], g[1][1], g[2][0], g[2][1]);
      cx.stroke();
      cx.strokeStyle = pap(0.4);
      cx.lineWidth = 1.6;
      cx.beginPath();
      cx.moveTo(g[0][0], g[0][1] + H * 0.011);
      cx.quadraticCurveTo(g[1][0], g[1][1] + H * 0.011, g[2][0], g[2][1] + H * 0.011);
      cx.stroke();
    }
    cx.strokeStyle = ink(0.92);
    cx.lineWidth = 7;
    cx.lineCap = 'round';
    cx.beginPath();
    cx.moveTo(W * 0.5, tipY - H * 0.012);
    cx.lineTo(W * 0.5, tipY + H * 0.05);
    cx.stroke();

    const aPos = ph < 0.05 ? -1
      : ph < 0.45 ? L(-1, 1, S(0.05, 0.45, ph))
      : ph < 0.55 ? 1
      : ph < 0.95 ? L(1, -1, S(0.55, 0.95, ph))
      : -1;
    const hgt = ph < 0.05 ? 1 - S(0, 0.05, ph)
      : ph < 0.45 ? 0
      : ph < 0.55 ? S(0.45, 0.55, ph)
      : 1;
    const wl = HY + 0.44 * (H * 1.15 - HY);

    for (const side of [-1, 1]) {
      const g = side < 0 ? gl : gr;
      const pv = qp(g[0], g[1], g[2], 0.52);
      const tipX = pv[0] + side * (W * 0.1 + aPos * W * 0.01);
      const tY = wl + aPos * H * 0.07 - hgt * H * 0.045;
      const fly = side > 0 ? fall : 0;
      const tx = tipX + fly * W * 0.22, ty = tY - fly * H * 0.26;

      cx.strokeStyle = ink(0.55);
      cx.lineWidth = 4;
      cx.beginPath();
      cx.arc(pv[0], pv[1] - 4, 6.5, Math.PI * 0.15, Math.PI * 0.85, true);
      cx.stroke();

      const hx = pv[0] - (tx - pv[0]) * 0.3, hy = pv[1] - (ty - pv[1]) * 0.3;
      taper(hx, hy, pv[0], pv[1], W * 0.005, W * 0.0068, 0.88, 0);
      taper(pv[0], pv[1], tx, ty, W * 0.0068, W * 0.0034, 0.88, 10 + drive * 8);

      const ang = Math.atan2(ty - pv[1], tx - pv[0]) + fly * 1.8;
      const ff = 1 - 0.68 * S(0.6, 1, hgt);
      cx.save();
      cx.translate(tx, ty);
      cx.rotate(ang);
      cx.fillStyle = ink(0.9);
      cx.beginPath();
      cx.ellipse(W * 0.013, 0, W * 0.026, W * 0.0095 * ff, 0, 0, 7);
      cx.fill();
      cx.strokeStyle = pap(0.35);
      cx.lineWidth = 1.4;
      cx.beginPath();
      cx.moveTo(-W * 0.008, 0);
      cx.lineTo(W * 0.036, 0);
      cx.stroke();
      cx.restore();

      if (hgt < 0.2 && uw < 0.3) {
        const rp = 0.25 + (aPos + 1) * 0.5 * 0.75;
        cx.strokeStyle = pap(0.55 - rp * 0.3);
        cx.lineWidth = 2.2;
        cx.beginPath();
        cx.ellipse(tipX, tY + 6, 14 + rp * 46, 4 + rp * 9, 0, 0, 7);
        cx.stroke();
        cx.strokeStyle = ink(0.2 - rp * 0.1);
        cx.beginPath();
        cx.ellipse(tipX, tY + 6, 26 + rp * 60, 6 + rp * 12, 0, 0, 7);
        cx.stroke();
      }
      if (ph > 0.45 && ph < 0.62 && uw < 0.3) {
        const k = (ph - 0.45) / 0.17;
        for (let j = 0; j < 3; j++) {
          const rj = rnd(stroke * 13 + j + (side + 1) * 31);
          const dx = tipX - side * k * W * (0.01 + rj * 0.02);
          const dy = tY + 4 - Math.sin(Math.min(k * (0.7 + rj * 0.6), 1) * Math.PI) * H * (0.02 + rj * 0.03);
          cx.fillStyle = pap(0.75 * (1 - k));
          cx.strokeStyle = ink(0.4 * (1 - k));
          cx.lineWidth = 1;
          cx.beginPath();
          cx.arc(dx, dy, 1.5 + rj * 2.2, 0, 7);
          cx.fill();
          cx.stroke();
        }
      }
    }

    if (fall > 0.15 && uw < 0.8) {
      for (let i = 0; i < 16; i++) {
        const p = S(0.15, 1, fall) * (0.6 + rnd(i) * 0.4);
        const dx = W * (0.5 + (rnd(i + 5) - 0.5) * 1.15 * (0.3 + p));
        const dy = H * 0.92 - Math.sin(Math.min(p * 1.3, 1) * Math.PI) * H * (0.2 + rnd(i + 9) * 0.45);
        cx.fillStyle = pap(0.8 * (1 - uw));
        cx.strokeStyle = ink(0.45 * (1 - uw));
        cx.lineWidth = 1.2;
        cx.beginPath();
        cx.arc(dx, dy, 1.5 + rnd(i + 13) * 3.5, 0, 7);
        cx.fill();
        cx.stroke();
      }
    }
  }
  cx.restore();

  if (uw > 0) {
    const sink = S(9, 11.6, t);
    const g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `rgba(58,66,60,${uw * 0.88})`);
    g.addColorStop(1, `rgba(24,26,23,${uw * 0.97})`);
    cx.fillStyle = g;
    cx.fillRect(0, 0, W, H);

    const sy = L(H * 0.24, -H * 0.18, sink);
    cx.strokeStyle = pap(0.5 * uw * (1 - sink * 0.85));
    cx.lineWidth = 3;
    cx.beginPath();
    for (let x = 0; x <= W; x += 18) {
      const yy = sy + Math.sin(x * 0.02 + t * 1.7) * 9;
      x === 0 ? cx.moveTo(x, yy) : cx.lineTo(x, yy);
    }
    cx.stroke();
    cx.fillStyle = ink(0.85 * uw * (1 - sink));
    cx.beginPath();
    cx.ellipse(W * 0.5, sy - 12, W * 0.13, H * 0.03, 0.06, 0, 7);
    cx.fill();

    for (let i = 0; i < 5; i++) {
      cx.fillStyle = pap(0.035 * uw * (1 - sink * 0.7));
      cx.beginPath();
      const bx = W * (0.15 + i * 0.18);
      cx.moveTo(bx - 30, sy); cx.lineTo(bx + 60, sy);
      cx.lineTo(bx + 170, H); cx.lineTo(bx - 10, H);
      cx.closePath(); cx.fill();
    }
    for (let i = 0; i < 26; i++) {
      const life = (t - 8.85) * (0.55 + rnd(i) * 0.75);
      if (life > 0 && life < 1) {
        const bx = W * (0.5 + (rnd(i + 5) - 0.5) * 0.9 * (0.3 + life));
        const by = H * (0.92 - life * 0.95);
        cx.strokeStyle = pap(0.55 * (1 - life) * uw);
        cx.lineWidth = 1.4;
        cx.beginPath();
        cx.arc(bx, by, 2 + rnd(i + 9) * 6, 0, 7);
        cx.stroke();
      }
    }
    for (let i = 0; i < 18; i++) {
      const p = (rnd(i + 3) + (t - 8.8) * (0.08 + rnd(i) * 0.1)) % 1;
      const bx = W * rnd(i + 61) + Math.sin(t * 2 + i) * 9;
      cx.strokeStyle = pap(0.35 * uw * (1 - p * 0.6));
      cx.lineWidth = 1.3;
      cx.beginPath();
      cx.arc(bx, H * (1 - p), 2 + rnd(i + 13) * 4.5, 0, 7);
      cx.stroke();
    }

    const ft = S(9.5, 11.2, t);
    if (ft > 0 && ft < 1) {
      const fx = L(W * 1.15, -W * 0.15, ft);
      const fy = H * 0.44 + Math.sin(ft * 9) * H * 0.03;
      const fw = W * 0.085;
      cx.strokeStyle = pap(0.55 * uw);
      cx.lineWidth = 2.4;
      cx.lineCap = 'round';
      cx.beginPath();
      cx.moveTo(fx + fw, fy);
      cx.quadraticCurveTo(fx + fw * 0.4, fy - fw * 0.28, fx, fy + fw * 0.06);
      cx.moveTo(fx + fw, fy);
      cx.quadraticCurveTo(fx + fw * 0.4, fy + fw * 0.34, fx, fy - fw * 0.06);
      cx.moveTo(fx + fw, fy);
      cx.lineTo(fx + fw * 1.22, fy - fw * 0.2);
      cx.moveTo(fx + fw, fy);
      cx.lineTo(fx + fw * 1.22, fy + fw * 0.2);
      cx.stroke();
    }
  }

  cx.fillStyle = `rgba(20,20,18,${S(10.8, 12, t)})`;
  cx.fillRect(0, 0, W, H);
};

const loop = now => {
  const t = frozen !== null ? +frozen : Math.min((now - t0) / 1000, DUR + 0.01);
  draw(t);
  if (frozen === null && t >= DUR) againBtn.classList.add('on');
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);

againBtn.addEventListener('click', () => {
  t0 = performance.now();
  againBtn.classList.remove('on');
});
</script>
</body>
</html>
