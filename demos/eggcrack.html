<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>egg cracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f2efe6; color: #1c1b18; font: 15px/1.5 Georgia, serif; padding: 48px clamp(24px, 6vw, 90px); cursor: url("../assets/cursor.svg") 2 2, auto; }
  h1 { font-size: 20px; font-weight: normal; letter-spacing: .08em; margin-bottom: 6px; }
  .note { opacity: .55; font-size: 13px; margin-bottom: 34px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .card { position: relative; border: 1px solid rgba(28,27,24,.18); border-radius: 8px; padding: 26px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(255,255,255,.25); }
  .card:hover { border-color: rgba(28,27,24,.45); }
  .num { position: absolute; top: 8px; left: 12px; color: #b43a2b; font-size: 17px; }
  .cname { font-size: 12.5px; opacity: .6; letter-spacing: .06em; }
  svg.stagebox { width: 170px; height: 190px; display: block; }
  .shell { fill: #fdfaf1; stroke: #1c1b18; stroke-width: 2.6; stroke-linecap: round; }
  .fishp { fill: none; stroke: #1c1b18; stroke-width: 15; stroke-linecap: round; }
  .fish { opacity: 0; }
  .play .fish { animation: fishup .8s cubic-bezier(.2,.8,.3,1) forwards; }
  @keyframes fishup { from { opacity: 0; transform: translateY(10px) scale(.6); } to { opacity: 1; transform: translateY(-22px) scale(1); } }

  .crackline { fill: none; stroke: #1c1b18; stroke-width: 2; stroke-dasharray: 90; stroke-dashoffset: 90; }
  .play .c1-egg { animation: shake1 .5s linear .55s; }
  .play .crackline { animation: drawcrack .45s ease-out .15s forwards; }
  .play .c1-top { animation: topoff .7s ease-in 1.05s forwards; }
  .play .c1-bot { animation: botoff .7s ease-in 1.15s forwards; }
  .c1-fish-delay { animation-delay: 1.25s !important; }
  @keyframes drawcrack { to { stroke-dashoffset: 0; } }
  @keyframes shake1 { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-2px) rotate(-1.5deg); } 40%,80% { transform: translateX(2px) rotate(1.5deg); } }
  @keyframes topoff { to { transform: translate(-7px,-30px) rotate(-24deg); opacity: 0; } }
  @keyframes botoff { to { transform: translate(4px,14px) rotate(8deg); opacity: 0; } }

  .shard { opacity: 0; }
  .play .shard { animation: fly .8s ease-out .65s forwards; }
  .play .c2-egg { animation: shake2 .65s linear forwards, vanish .01s linear .65s forwards; }
  .c2-fish-delay { animation-delay: .85s !important; }
  @keyframes shake2 { 0%,100% { transform: translateX(0); } 15%,55% { transform: translateX(-1.5px); } 30%,70% { transform: translateX(1.5px); } 45%,85% { transform: translateX(-2.5px); } }
  @keyframes vanish { to { opacity: 0; } }
  @keyframes fly { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(var(--fr)); } }

  .play .c3-egg { animation: wobble 1s ease-in-out; transform-origin: 0 25px; }
  .play .c3-cap { animation: capoff .9s cubic-bezier(.3,.6,.4,1) 1s forwards; transform-origin: 16px -8px; }
  .play .c3-shell { animation: shellfade .6s linear 1.7s forwards; }
  .c3-fish-delay { animation-delay: 1.3s !important; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-4deg); } 35% { transform: rotate(4deg); } 55% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  @keyframes capoff { 40% { transform: translate(10px,-26px) rotate(38deg); opacity: 1; } 100% { transform: translate(22px,18px) rotate(74deg); opacity: 0; } }
  @keyframes shellfade { to { opacity: 0; } }
</style>
</head>
<body>
<h1>egg cracking</h1>
<div class="note">click a card to replay its crack. pick a number.</div>

<div class="grid">
  <div class="card play" data-demo>
    <span class="num">1</span>
    <svg class="stagebox" viewBox="-85 -95 170 190">
      <g class="fish c1-fish-delay"><g transform="translate(-27,-16) scale(.16)"><path class="fishp" d="M310 100 Q180 10 30 148"/><path class="fishp" d="M310 100 Q180 190 30 52"/><circle cx="264" cy="98" r="11" fill="#1c1b18"/></g></g>
      <g class="c1-egg" transform="translate(0,20)">
        <g class="c1-top">
          <clipPath id="clip-top"><polygon points="-26,-32 26,-32 26,3 13,-1 6,5 -2,-3 -9,5 -19,1 -26,1"/></clipPath>
          <path class="shell" clip-path="url(#clip-top)" d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/>
        </g>
        <g class="c1-bot">
          <clipPath id="clip-bot"><polygon points="-26,1 -19,1 -9,5 -2,-3 6,5 13,-1 26,3 26,32 -26,32"/></clipPath>
          <path class="shell" clip-path="url(#clip-bot)" d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/>
        </g>
        <polyline class="crackline" points="-19,1 -9,5 -2,-3 6,5 13,-1 19,3"/>
      </g>
    </svg>
    <span class="cname">ink crack, split</span>
  </div>

  <div class="card play" data-demo>
    <span class="num">2</span>
    <svg class="stagebox" viewBox="-85 -95 170 190">
      <g class="fish c2-fish-delay"><g transform="translate(-27,-16) scale(.16)"><path class="fishp" d="M310 100 Q180 10 30 148"/><path class="fishp" d="M310 100 Q180 190 30 52"/><circle cx="264" cy="98" r="11" fill="#1c1b18"/></g></g>
      <g transform="translate(0,20)">
        <g class="c2-egg"><path class="shell" d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/></g>
        <polygon class="shard shell" style="--fx:-34px; --fy:-22px; --fr:-70deg" points="-4,-23 8,-20 3,-8 -9,-13"/>
        <polygon class="shard shell" style="--fx:32px; --fy:-14px; --fr:60deg" points="10,-18 18,-2 6,-2 4,-12"/>
        <polygon class="shard shell" style="--fx:-38px; --fy:10px; --fr:-50deg" points="-18,-4 -8,-8 -6,6 -17,8"/>
        <polygon class="shard shell" style="--fx:26px; --fy:26px; --fr:45deg" points="16,6 12,20 2,23 4,8"/>
        <polygon class="shard shell" style="--fx:-16px; --fy:34px; --fr:-38deg" points="-14,10 -2,12 -3,24 -12,20"/>
      </g>
    </svg>
    <span class="cname">shatter burst</span>
  </div>

  <div class="card play" data-demo>
    <span class="num">3</span>
    <svg class="stagebox" viewBox="-85 -95 170 190">
      <g class="fish c3-fish-delay"><g transform="translate(-27,-16) scale(.16)"><path class="fishp" d="M310 100 Q180 10 30 148"/><path class="fishp" d="M310 100 Q180 190 30 52"/><circle cx="264" cy="98" r="11" fill="#1c1b18"/></g></g>
      <g class="c3-egg" transform="translate(0,20)">
        <g class="c3-cap">
          <clipPath id="clip-cap"><polygon points="-26,-32 26,-32 26,-6 14,-10 5,-3 -5,-11 -14,-4 -26,-8"/></clipPath>
          <path class="shell" clip-path="url(#clip-cap)" d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/>
        </g>
        <g class="c3-shell">
          <clipPath id="clip-cup"><polygon points="-26,-8 -14,-4 -5,-11 5,-3 14,-10 26,-6 26,32 -26,32"/></clipPath>
          <path class="shell" clip-path="url(#clip-cup)" d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/>
        </g>
      </g>
    </svg>
    <span class="cname">pop the cap</span>
  </div>
</div>

<script>
  for (const card of document.querySelectorAll('[data-demo]')) {
    card.addEventListener('click', () => {
      card.classList.remove('play');
      void card.offsetWidth;
      card.classList.add('play');
    });
  }
</script>
</body>
</html>
