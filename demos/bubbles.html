<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bubble options</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:'Courier New',monospace; }
  h1{ font-size:15px; letter-spacing:.2em; font-weight:normal; text-align:center; margin:26px 0 18px; }
  .row{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; padding:0 20px 40px; }
  .opt{ text-align:center; }
  canvas{ display:block; background:#f2efe6; box-shadow:inset 0 0 40px rgba(28,27,24,.05); border:1px solid rgba(28,27,24,.15); }
  .lab{ font-size:12px; letter-spacing:.12em; margin-top:10px; }
  .sub{ font-size:11px; letter-spacing:.08em; opacity:.55; margin-top:3px; }
</style>
</head>
<body>
<h1>bubble options</h1>
<div class="row" id="row"></div>
<script>
const rand = (a, b) => a + Math.random() * (b - a);
const OPTS = [
  { lab: '0 · current', sub: 'ink 10-18%', stroke: '28,27,24', a: [0.10, 0.18] },
  { lab: '1 · ink, stronger', sub: 'ink 16-26%', stroke: '28,27,24', a: [0.16, 0.26] },
  { lab: '2 · water blue', sub: 'blue-grey 20-32%', stroke: '62,84,110', a: [0.20, 0.32] },
  { lab: '3 · sea green', sub: 'celadon 20-32%', stroke: '82,112,100', a: [0.20, 0.32] },
  { lab: '4 · ink + blue wash', sub: 'ink line, blue fill', stroke: '28,27,24', a: [0.13, 0.21], fill: '110,145,165', fa: 0.35 }
];
const W = 250, H = 430;
for (const o of OPTS) {
  const d = document.createElement('div');
  d.className = 'opt';
  d.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="lab">${o.lab}</div><div class="sub">${o.sub}</div>`;
  document.getElementById('row').appendChild(d);
  o.ctx = d.querySelector('canvas').getContext('2d');
  o.bubbles = [];
  o.acc = 0;
}
let last = performance.now();
const frame = now => {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  for (const o of OPTS) {
    o.acc += 1.6 * dt;
    while (o.acc >= 1) {
      o.acc -= 1;
      o.bubbles.push({
        x: W / 2 + rand(-30, 30), y: H + rand(4, 20),
        r: rand(1.6, 4.2), vy: rand(80, 130),
        wamp: rand(3, 7), wf: rand(0.5, 1), ph: rand(0, Math.PI * 2),
        a: rand(o.a[0], o.a[1]), fade: 1
      });
    }
    const ctx = o.ctx;
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.2;
    for (let i = o.bubbles.length - 1; i >= 0; i--) {
      const b = o.bubbles[i];
      b.ph += dt * b.wf * Math.PI * 2;
      b.y -= b.vy * (1 + (1 - b.y / H) * 0.35) * dt;
      b.x += Math.sin(b.ph) * b.wamp * dt;
      if (b.y < H * 0.07) b.fade -= dt / 0.45;
      if (b.fade <= 0) { o.bubbles.splice(i, 1); continue; }
      const grow = 1 + (1 - b.y / H) * 0.3;
      const al = b.a * Math.max(b.fade, 0);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * grow, 0, Math.PI * 2);
      if (o.fill) {
        ctx.fillStyle = `rgba(${o.fill},${al * o.fa})`;
        ctx.fill();
      }
      ctx.strokeStyle = `rgba(${o.stroke},${al})`;
      ctx.stroke();
    }
  }
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
