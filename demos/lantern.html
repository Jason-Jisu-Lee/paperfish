<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lantern styles</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:Georgia,serif; padding:34px 44px 60px; }
  h1{ font-size:16px; letter-spacing:.34em; text-transform:uppercase; font-weight:normal; margin:0 0 6px; }
  .sub{ font-size:12.5px; opacity:.55; margin:0 0 26px; letter-spacing:.04em; }
  .opt{ margin-bottom:32px; }
  .cap{ font-size:13.5px; letter-spacing:.05em; margin:0 0 7px; }
  .cap b{ color:#b43a2b; font-weight:600; margin-right:9px; }
  .cap span{ opacity:.58; }
  canvas{ display:block; width:100%; height:180px; background:linear-gradient(#f4f1e8,#eeebe0); border:1px solid rgba(28,27,24,.14); border-radius:4px; }
</style>
</head>
<body>
<h1>lantern styles, minimal</h1>
<p class="sub">each shown at 3, 2, and 1 charges left to right.</p>

<div class="opt"><p class="cap"><b>1</b>ring<span>one thin circle, one red dot; the dot shrinks per tap</span></p><canvas data-s="0"></canvas></div>
<div class="opt"><p class="cap"><b>2</b>vessel<span>a slim capsule holding warmth; the level drains per tap</span></p><canvas data-s="1"></canvas></div>
<div class="opt"><p class="cap"><b>3</b>seal stack<span>floating red seal chips, one per charge, nothing else</span></p><canvas data-s="2"></canvas></div>

<script>
const INK = a => `rgba(28,27,24,${a})`;
const SEAL = a => `rgba(180,58,43,${a})`;

const ring = (c, x, y, heat) => {
  c.strokeStyle = INK(0.55);
  c.lineWidth = 1.4;
  c.beginPath();
  c.arc(x, y, 15, 0, Math.PI * 2);
  c.stroke();
  c.fillStyle = SEAL(0.9);
  c.beginPath();
  c.arc(x, y, heat === 3 ? 4.6 : heat === 2 ? 3.2 : 2, 0, Math.PI * 2);
  c.fill();
};

const vessel = (c, x, y, heat) => {
  const w = 18, h = 36, r = 9;
  const cap = () => {
    c.beginPath();
    c.moveTo(x - w / 2, y - h / 2 + r);
    c.arcTo(x - w / 2, y - h / 2, x, y - h / 2, r);
    c.arcTo(x + w / 2, y - h / 2, x + w / 2, y - h / 2 + r, r);
    c.lineTo(x + w / 2, y + h / 2 - r);
    c.arcTo(x + w / 2, y + h / 2, x, y + h / 2, r);
    c.arcTo(x - w / 2, y + h / 2, x - w / 2, y + h / 2 - r, r);
    c.closePath();
  };
  c.save();
  cap();
  c.clip();
  const lvl = (h - 4) * heat / 3;
  c.fillStyle = 'rgba(238,199,113,0.55)';
  c.fillRect(x - w / 2, y + h / 2 - lvl, w, lvl);
  c.restore();
  c.strokeStyle = INK(0.6);
  c.lineWidth = 1.4;
  cap();
  c.stroke();
};

const seals = (c, x, y, heat) => {
  for (let i = 0; i < heat; i++) {
    const yy = y + (i - (heat - 1) / 2) * 17;
    c.save();
    c.translate(x, yy);
    c.rotate(Math.PI / 4);
    c.fillStyle = SEAL(0.88);
    c.fillRect(-4.6, -4.6, 9.2, 9.2);
    c.restore();
  }
};

const STYLES = [ring, vessel, seals];
const panels = [];
for (const cv of document.querySelectorAll('canvas')) {
  panels.push({ cv, c: cv.getContext('2d'), s: +cv.dataset.s, W: 0, H: 0, t: Math.random() * 7 });
}

const size = () => {
  const dpr = window.devicePixelRatio || 1;
  for (const p of panels) {
    p.W = p.cv.clientWidth;
    p.H = p.cv.clientHeight;
    p.cv.width = Math.round(p.W * dpr);
    p.cv.height = Math.round(p.H * dpr);
    p.c.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
};
window.addEventListener('resize', size);
size();

let last = performance.now();
const loop = now => {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  for (const p of panels) {
    p.t += dt;
    p.c.clearRect(0, 0, p.W, p.H);
    for (let i = 0; i < 3; i++) {
      const x = p.W * (0.25 + 0.25 * i) + Math.sin(p.t * 0.7 + i * 2) * 3;
      const y = p.H / 2 + Math.sin(p.t * 2 * Math.PI / 4.2 + i) * 4;
      STYLES[p.s](p.c, x, y, 3 - i);
    }
  }
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
</script>
</body>
</html>
