<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paperfish — Ink</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root{ --paper:#f2efe6; --ink:#1c1b18; --seal:#b43a2b; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(140% 100% at 30% 20%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(90% 80% at 85% 90%, rgba(190,182,160,.22), transparent 55%),
      var(--paper);
    font-family:'Zen Maru Gothic',sans-serif;
  }

  .stage{ position:absolute; inset:0; display:grid; place-items:center; }
  .fish{ width:min(52vw,560px); }
  .fish path{
    fill:none; stroke:var(--ink); stroke-linecap:round;
    stroke-dasharray:520; stroke-dashoffset:520;
    animation:draw 3.2s cubic-bezier(.6,0,.2,1) forwards;
  }
  /* a second, dry-brush pass: thinner, slightly offset, delayed */
  .fish .wash{ stroke-width:2; opacity:.28; animation-delay:.45s; }
  .fish .body{ stroke-width:6.5; }
  .fish path:nth-child(2){ animation-delay:.9s; }
  .fish path:nth-child(4){ animation-delay:1.35s; }
  @keyframes draw{ to{ stroke-dashoffset:0 } }

  /* ink pool shadow beneath */
  .pool{ position:absolute; left:50%; top:63%; width:min(30vw,320px); height:14px;
    transform:translateX(-52%); background:radial-gradient(50% 50% at 50% 50%, rgba(28,27,24,.14), transparent 70%);
    opacity:0; animation:appear 1.6s ease 2.6s forwards; }
  @keyframes appear{ to{opacity:1} }

  /* vertical caption, right edge */
  .vert{
    position:absolute; right:6vw; top:50%; transform:translateY(-50%);
    writing-mode:vertical-rl; font-family:'Shippori Mincho',serif;
    font-size:15px; letter-spacing:.9em; color:#4a463c;
  }
  .title{
    position:absolute; left:6.5vw; bottom:7vh;
    font-family:'Shippori Mincho',serif; font-size:13px; letter-spacing:.55em;
    text-transform:uppercase; color:#3a372f;
  }
  /* hanko seal */
  .seal{
    position:absolute; right:6vw; bottom:7vh; width:34px; height:34px;
    background:var(--seal); border-radius:3px; display:grid; place-items:center;
    box-shadow:0 0 0 1px rgba(180,58,43,.25);
  }
  .seal svg{ width:24px } .seal path{ fill:none; stroke:var(--paper); stroke-width:14; stroke-linecap:round; }

  @media (prefers-reduced-motion: reduce){
    .fish path{ animation:none; stroke-dashoffset:0 } .pool{ animation:none; opacity:1 }
  }
</style>
</head>
<body>
  <div class="stage">
    <svg class="fish" viewBox="0 0 340 200" aria-label="fish drawn in ink">
      <path class="body" d="M30,100 Q160,10 310,148"/>
      <path class="body" d="M30,100 Q160,190 310,52"/>
      <path class="wash" d="M34,106 Q160,22 306,150"/>
      <path class="wash" d="M34,94 Q160,178 306,50"/>
    </svg>
  </div>
  <div class="pool"></div>

  <div class="vert">深海より</div>
  <div class="title">Paperfish</div>
  <div class="seal" aria-hidden="true">
    <svg viewBox="0 0 340 200">
      <path d="M30,100 Q160,10 310,148"/>
      <path d="M30,100 Q160,190 310,52"/>
    </svg>
  </div>
</body>
</html>
