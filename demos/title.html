<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paperfish title demos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Sniglet&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{ --paper:#f2efe6; --ink:#1c1b18; --seal:#b43a2b; }
      *{ margin:0; padding:0; box-sizing:border-box; }
      body{
        background:
          radial-gradient(140% 100% at 30% 20%, rgba(255,255,255,.55), transparent 60%),
          radial-gradient(90% 80% at 85% 90%, rgba(190,182,160,.22), transparent 55%),
          var(--paper);
        color:var(--ink);
        font-family:'Shippori Mincho',serif;
      }
      .note{
        text-align:center;
        font-family:'Sniglet',sans-serif;
        font-size:13px;
        color:rgba(28,27,24,.6);
        padding:26px 0 4px;
      }
      section{
        min-height:330px;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        position:relative;
        border-bottom:1px solid rgba(28,27,24,.12);
        padding:44px 20px;
      }
      .num{
        position:absolute; top:18px; left:26px;
        font-family:'Sniglet',sans-serif;
        font-size:12px; letter-spacing:.2em;
        color:rgba(28,27,24,.5);
      }
      .num b{
        display:inline-grid; place-items:center;
        width:22px; height:22px;
        border:1px solid rgba(28,27,24,.4);
        border-radius:50%;
        margin-right:8px;
        font-weight:400;
      }
      .menu{
        display:flex; gap:44px; margin-top:34px;
        font-size:16px; letter-spacing:.4em; text-indent:.4em;
        color:rgba(28,27,24,.88);
        font-weight:500;
      }
      .t1{
        font-weight:500;
        font-size:40px;
        letter-spacing:.5em; text-indent:.5em;
        text-transform:uppercase;
        color:#2e2c26;
      }
      .t2{
        font-weight:500;
        font-size:58px;
        letter-spacing:.06em;
        color:var(--ink);
        text-shadow:0 0 1px rgba(28,27,24,.35);
      }
      .t2 .seal{
        display:inline-block;
        width:13px; height:13px;
        background:var(--seal);
        border-radius:2px;
        margin-left:14px;
        transform:translateY(-30px) rotate(8deg);
      }
      .t3wrap{ text-align:center; }
      .t3{
        font-weight:500;
        font-size:44px;
        letter-spacing:.34em; text-indent:.34em;
        text-transform:uppercase;
        color:#26241f;
      }
      .t3wrap svg{ width:380px; margin-top:6px; display:block; margin-left:auto; margin-right:auto; }
      .t4wrap{ position:relative; display:grid; place-items:center; }
      .t4wash{
        position:absolute;
        width:480px; height:150px;
        background:radial-gradient(55% 60% at 50% 50%, rgba(28,27,24,.14), rgba(28,27,24,.05) 60%, transparent 75%);
        filter:blur(2px);
        transform:rotate(-1.2deg);
      }
      .t4{
        position:relative;
        font-weight:600;
        font-size:48px;
        letter-spacing:.3em; text-indent:.3em;
        text-transform:uppercase;
        color:#211f1a;
      }
      .t5{
        font-weight:400;
        font-size:46px;
        letter-spacing:.72em; text-indent:.72em;
        text-transform:uppercase;
        color:rgba(28,27,24,.85);
      }
      .t5 .dot{
        display:inline-block;
        width:9px; height:9px;
        background:var(--seal);
        border-radius:50%;
        margin-left:-24px;
        transform:translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="note">paperfish title treatments. pick a number.</div>

    <section>
      <div class="num"><b>1</b>current</div>
      <div class="t1">paperfish</div>
      <nav class="menu"><span>play</span><span>settings</span><span>quit</span></nav>
    </section>

    <section>
      <div class="num"><b>2</b>ink lowercase, red seal</div>
      <div class="t2">paperfish<span class="seal"></span></div>
      <nav class="menu"><span>play</span><span>settings</span><span>quit</span></nav>
    </section>

    <section>
      <div class="num"><b>3</b>brush underline</div>
      <div class="t3wrap">
        <div class="t3">paperfish</div>
        <svg viewBox="0 0 380 26">
          <path d="M8 15 C70 8 150 6 220 9 C280 11 340 14 372 12 C340 19 260 22 190 21 C120 20 50 19 8 15 Z" fill="rgba(28,27,24,.82)" />
        </svg>
      </div>
      <nav class="menu"><span>play</span><span>settings</span><span>quit</span></nav>
    </section>

    <section>
      <div class="num"><b>4</b>ink wash</div>
      <div class="t4wrap">
        <div class="t4wash"></div>
        <div class="t4">paperfish</div>
      </div>
      <nav class="menu"><span>play</span><span>settings</span><span>quit</span></nav>
    </section>

    <section>
      <div class="num"><b>5</b>gallery thin, seal period</div>
      <div class="t5">paperfish<span class="dot"></span></div>
      <nav class="menu"><span>play</span><span>settings</span><span>quit</span></nav>
    </section>
  </body>
</html>
