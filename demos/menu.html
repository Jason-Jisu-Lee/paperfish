<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paperfish menu font demos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Sniglet&family=Zen+Maru+Gothic:wght@500&family=Kaisei+Decol&family=Klee+One:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{ --paper:#f2efe6; --ink:#1c1b18; --seal:#b43a2b; }
      *{ margin:0; padding:0; box-sizing:border-box; }
      body{
        background:
          radial-gradient(140% 100% at 30% 20%, rgba(255,255,255,.55), transparent 60%),
          radial-gradient(90% 80% at 85% 90%, rgba(190,182,160,.22), transparent 55%),
          var(--paper);
        color:var(--ink);
        font-family:'Shippori Mincho',serif;
      }
      .note{
        text-align:center;
        font-family:'Sniglet',sans-serif;
        font-size:13px;
        color:rgba(28,27,24,.6);
        padding:26px 0 4px;
      }
      section{
        min-height:280px;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        position:relative;
        border-bottom:1px solid rgba(28,27,24,.12);
        padding:40px 20px;
      }
      .num{
        position:absolute; top:18px; left:26px;
        font-family:'Sniglet',sans-serif;
        font-size:12px; letter-spacing:.2em;
        color:rgba(28,27,24,.5);
      }
      .num b{
        display:inline-grid; place-items:center;
        width:22px; height:22px;
        border:1px solid rgba(28,27,24,.4);
        border-radius:50%;
        margin-right:8px;
        font-weight:400;
      }
      .title{
        font-weight:500;
        font-size:26px;
        letter-spacing:.5em; text-indent:.5em;
        text-transform:uppercase;
        color:rgba(46,44,38,.5);
        margin-bottom:34px;
      }
      .menu{
        display:flex; flex-direction:column; align-items:center; gap:18px;
        font-size:20px; letter-spacing:.4em; text-indent:.4em;
        color:rgba(28,27,24,.88);
      }
      .f1{ font-family:'Shippori Mincho',serif; font-weight:500; }
      .f2{ font-family:'Sniglet',sans-serif; letter-spacing:.3em; text-indent:.3em; }
      .f3{ font-family:'Zen Maru Gothic',sans-serif; font-weight:500; letter-spacing:.34em; text-indent:.34em; }
      .f4{ font-family:'Kaisei Decol',serif; letter-spacing:.3em; text-indent:.3em; }
      .f5{ font-family:'Klee One',cursive; font-weight:600; letter-spacing:.26em; text-indent:.26em; }
    </style>
  </head>
  <body>
    <div class="note">paperfish menu fonts. pick a number.</div>

    <section>
      <div class="num"><b>1</b>shippori mincho, current</div>
      <div class="title">paperfish</div>
      <nav class="menu f1"><span>play</span><span>settings</span></nav>
    </section>

    <section>
      <div class="num"><b>2</b>sniglet, matches game ui</div>
      <div class="title">paperfish</div>
      <nav class="menu f2"><span>play</span><span>settings</span></nav>
    </section>

    <section>
      <div class="num"><b>3</b>zen maru gothic, soft round</div>
      <div class="title">paperfish</div>
      <nav class="menu f3"><span>play</span><span>settings</span></nav>
    </section>

    <section>
      <div class="num"><b>4</b>kaisei decol, hand serif</div>
      <div class="title">paperfish</div>
      <nav class="menu f4"><span>play</span><span>settings</span></nav>
    </section>

    <section>
      <div class="num"><b>5</b>klee one, brush hand</div>
      <div class="title">paperfish</div>
      <nav class="menu f5"><span>play</span><span>settings</span></nav>
    </section>
  </body>
</html>
