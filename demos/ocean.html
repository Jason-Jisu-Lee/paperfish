<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ocean ambience options</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:'Courier New',monospace; }
  h1{ font-size:15px; letter-spacing:.2em; font-weight:normal; text-align:center; margin:26px 0 6px; }
  .hint{ font-size:11px; letter-spacing:.1em; opacity:.55; text-align:center; margin-bottom:16px; }
  .row{ display:flex; justify-content:center; gap:18px; flex-wrap:wrap; padding:0 20px 40px; }
  .opt{ text-align:center; }
  canvas{ display:block; background:#f2efe6; box-shadow:inset 0 0 40px rgba(28,27,24,.05); border:1px solid rgba(28,27,24,.15); cursor:pointer; }
  .lab{ font-size:12px; letter-spacing:.12em; margin-top:10px; }
  .sub{ font-size:11px; letter-spacing:.08em; opacity:.55; margin-top:3px; }
</style>
</head>
<body>
<h1>ocean ambience options</h1>
<div class="hint">click each panel to interact</div>
<div class="row" id="row"></div>
<script>
const rand = (a, b) => a + Math.random() * (b - a);
const W = 320, H = 420, FLOOR = H - 46;
const INK = a => `rgba(28,27,24,${a})`;
const BLUE = a => `rgba(62,84,110,${a})`;

const mkBubbles = () => ({
  list: [],
  spawn(x, y, n = 1) {
    for (let i = 0; i < n; i++) this.list.push({
      x: x + rand(-4, 4), y, r: rand(1.2, 2.6),
      vy: rand(50, 80), ph: rand(0, 7), a: rand(0.2, 0.32), fade: 1
    });
  },
  step(ctx, dt) {
    ctx.lineWidth = 1.1;
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      b.ph += dt * 4; b.y -= b.vy * dt; b.x += Math.sin(b.ph) * 4 * dt;
      if (b.y < H * 0.12) b.fade -= dt / 0.4;
      if (b.fade <= 0) { this.list.splice(i, 1); continue; }
      ctx.strokeStyle = BLUE(b.a * b.fade);
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
    }
  }
});

const sand = ctx => {
  ctx.strokeStyle = INK(0.14); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(18, FLOOR + 14);
  ctx.quadraticCurveTo(W / 2, FLOOR + 8, W - 18, FLOOR + 15); ctx.stroke();
};

const OPTS = [
  {
    lab: '1 · clam', sub: 'click: snaps shut, spits bubbles',
    open: 0, phase: rand(2, 5), opening: true, bub: mkBubbles(),
    step(ctx, t, dt) {
      this.phase -= dt;
      if (this.phase <= 0) { this.opening = !this.opening; this.phase = this.opening ? rand(3, 6) : rand(2, 4); }
      const target = this.opening ? 0.42 + Math.sin(t * 1.3) * 0.05 : 0.02;
      this.open += (target - this.open) * Math.min(3 * dt, 1);
      if (this.opening && Math.random() < dt * 0.25) this.bub.spawn(W / 2 + 6, FLOOR - 16);
      const x = W / 2, y = FLOOR + 2;
      ctx.strokeStyle = INK(0.65); ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x - 20, y);
      ctx.quadraticCurveTo(x, y + 14, x + 20, y);
      ctx.quadraticCurveTo(x + 12, y - 12, x - 20, y); ctx.stroke();
      ctx.save();
      ctx.translate(x - 20, y); ctx.rotate(-this.open);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(28, -20, 40, 0); ctx.stroke();
      ctx.strokeStyle = INK(0.3); ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(12, -6); ctx.quadraticCurveTo(22, -11, 34, -3); ctx.stroke();
      ctx.restore();
      this.bub.step(ctx, dt);
    },
    click() { this.opening = false; this.phase = rand(2.5, 4); this.bub.spawn(W / 2 + 4, FLOOR - 18, 3); }
  },
  {
    lab: '2 · jellyfish', sub: 'click: pulses and darts up',
    y: 150, vy: 0, drift: rand(0, 7), squash: 1, bub: mkBubbles(),
    step(ctx, t, dt) {
      this.drift += dt;
      const x = W / 2 + Math.sin(this.drift * 0.35) * 34;
      this.vy += (150 - this.y) * 0.25 * dt;
      this.vy -= this.vy * 0.8 * dt;
      this.y += this.vy * dt;
      this.squash += (1 - this.squash) * Math.min(2.5 * dt, 1);
      const pulse = 1 + Math.sin(t * 1.4) * 0.05;
      const y = this.y + Math.sin(this.drift * 0.8) * 6;
      ctx.save();
      ctx.translate(x, y); ctx.scale(pulse, this.squash * (2 - pulse));
      ctx.strokeStyle = INK(0.45); ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, 4);
      ctx.quadraticCurveTo(-18, -16, 0, -17);
      ctx.quadraticCurveTo(18, -16, 16, 4);
      ctx.quadraticCurveTo(8, 1, 0, 4);
      ctx.quadraticCurveTo(-8, 1, -16, 4); ctx.stroke();
      ctx.strokeStyle = INK(0.3); ctx.lineWidth = 1.1;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * 9, 5);
        ctx.quadraticCurveTo(i * 9 + Math.sin(t * 1.6 + i) * 5, 16, i * 9 + Math.sin(t * 1.1 + i * 2) * 8, 27);
        ctx.stroke();
      }
      ctx.restore();
      this.bub.step(ctx, dt);
    },
    click() { this.vy = -85; this.squash = 0.7; this.bub.spawn(W / 2 + Math.sin(this.drift * 0.35) * 34, this.y - 14, 2); }
  },
  {
    lab: '3 · seagrass', sub: 'click: ripples, lets go a bubble',
    imp: 0, bub: mkBubbles(),
    step(ctx, t, dt) {
      this.imp -= this.imp * 2.2 * dt;
      const x = W / 2;
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const bx = x + (i - 1.5) * 9;
        const hgt = 44 + (i % 2) * 18;
        const sway = Math.sin(t * 0.7 + i * 1.1) * 7 + this.imp * (0.7 + i * 0.15);
        ctx.strokeStyle = INK(0.4 + i * 0.06); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(bx, FLOOR + 10);
        ctx.quadraticCurveTo(bx + sway * 0.4, FLOOR - hgt * 0.5, bx + sway, FLOOR - hgt);
        ctx.stroke();
      }
      this.bub.step(ctx, dt);
    },
    click() { this.imp = 26; this.bub.spawn(W / 2, FLOOR - 52); }
  },
  {
    lab: '4 · snail', sub: 'click: hides in its shell',
    x: W / 2, dir: 1, hideT: 0, bub: mkBubbles(),
    step(ctx, t, dt) {
      if (this.hideT > 0) this.hideT -= dt;
      else {
        this.x += this.dir * 4 * dt;
        if (this.x > W - 60) this.dir = -1;
        if (this.x < 60) this.dir = 1;
      }
      const x = this.x, y = FLOOR + 6, out = this.hideT <= 0;
      ctx.strokeStyle = INK(0.6); ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 20; i++) {
        const q = i / 20, ang = q * Math.PI * 2.3 + t * 0.02;
        const r = 8 * (1 - q * 0.8);
        const px = x + Math.cos(ang) * r, py = y - 9 + Math.sin(ang) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
      if (out) {
        const hx = x + this.dir * 13;
        ctx.strokeStyle = INK(0.5); ctx.lineWidth = 1.3;
        ctx.beginPath(); ctx.moveTo(x - this.dir * 8, y + 1);
        ctx.quadraticCurveTo(x + this.dir * 6, y + 3, hx, y - 1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx, y - 2); ctx.lineTo(hx + this.dir * 3, y - 8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hx - this.dir * 2, y - 2); ctx.lineTo(hx, y - 8); ctx.stroke();
      }
      this.bub.step(ctx, dt);
    },
    click() { this.hideT = 2.2; this.bub.spawn(this.x, FLOOR - 12, 1); }
  }
];

for (const o of OPTS) {
  const d = document.createElement('div');
  d.className = 'opt';
  d.innerHTML = `<canvas width="${W}" height="${H}"></canvas><div class="lab">${o.lab}</div><div class="sub">${o.sub}</div>`;
  document.getElementById('row').appendChild(d);
  const cv = d.querySelector('canvas');
  o.ctx = cv.getContext('2d');
  cv.addEventListener('click', () => o.click());
}
let last = performance.now();
const frame = now => {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const t = now / 1000;
  for (const o of OPTS) {
    o.ctx.clearRect(0, 0, W, H);
    sand(o.ctx);
    o.step(o.ctx, t, dt);
  }
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
