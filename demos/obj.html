<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css" />
<title>objective designs</title>
<style>
  body{ margin:0; background:#f2efe6; color:#1c1b18; font-family:'Zen Maru Gothic',sans-serif; padding-bottom:70px; }
  h1{ font-family:'Courier New',monospace; font-size:15px; letter-spacing:.2em; font-weight:normal; text-align:center; margin:26px 0 6px; }
  .hint{ font-family:'Courier New',monospace; font-size:11px; letter-spacing:.08em; opacity:.55; text-align:center; margin-bottom:24px; }
  .row{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; padding:0 20px; }
  .opt{ text-align:center; }
  .lab{ font-family:'Courier New',monospace; font-size:11.5px; letter-spacing:.1em; margin-top:11px; }
  .sub{ font-family:'Courier New',monospace; font-size:10px; opacity:.55; margin-top:4px; letter-spacing:.04em; width:430px; }
  .stage{
    width:430px; height:200px; position:relative; cursor:pointer;
    background:#f2efe6; border:1px solid rgba(28,27,24,.14); border-radius:4px;
    box-shadow:inset 0 0 40px rgba(28,27,24,.04); overflow:hidden;
  }
  .gold{ position:absolute; left:16px; top:12px; font-size:26px; color:#7a5800; font-feature-settings:'tnum'; }
  .gold b{ font-weight:500; }
  .gold i{ font-size:13px; font-style:normal; margin-left:5px; letter-spacing:.1em; }
  .tapme{ position:absolute; left:16px; bottom:10px; font-family:'Courier New',monospace; font-size:9.5px; letter-spacing:.14em; opacity:.35; }
  .fish{ position:absolute; left:44%; top:58%; width:52px; opacity:.75; }
  .fish path{ fill:none; stroke:rgba(28,27,24,.8); stroke-width:5; vector-effect:non-scaling-stroke; stroke-linecap:round; }

  .box{ position:absolute; right:14px; top:14px; transition:opacity .5s ease, transform .5s ease; }
  .box.gone{ opacity:0; transform:translateX(14px); }
  .chip{
    font-size:12.5px; font-weight:500; color:#7a5800; font-feature-settings:'tnum';
    background:rgba(122,88,0,.1); border-radius:999px; padding:3px 10px;
    transition:transform .75s cubic-bezier(.4,0,.2,1), opacity .75s ease;
  }
  .strike{ position:relative; }
  .done .strike::after{
    content:''; position:absolute; left:0; top:52%; height:1.4px; width:100%;
    background:currentColor; transform-origin:left; animation:str .3s ease-out forwards;
  }
  @keyframes str{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .mark{ flex:none; width:14px; height:14px; border:1.5px solid rgba(28,27,24,.5); border-radius:3px; position:relative; }
  .done .mark{ border-color:#3a8a4e; background:#3a8a4e; }
  .done .mark::after{
    content:''; position:absolute; left:4px; top:1px; width:4px; height:7px;
    border-right:1.8px solid #f2efe6; border-bottom:1.8px solid #f2efe6; transform:rotate(40deg);
  }

  /* 1 banner */
  .o1{ display:flex; align-items:center; gap:11px; padding:9px 12px 9px 13px;
    background:rgba(255,255,255,.55); border:1px solid rgba(28,27,24,.2); border-left:3px solid var(--seal,#b43a2b); border-radius:3px; }
  .o1 .col{ text-align:left; }
  .o1 .eb{ display:block; font-size:8.5px; letter-spacing:.28em; text-transform:uppercase; color:rgba(28,27,24,.45); }
  .o1 .tk{ display:block; font-size:14.5px; letter-spacing:.03em; margin-top:1px; }

  /* 2 tag */
  .o2{ padding:12px 15px 11px; background:#efece2; transform:rotate(-.7deg);
    box-shadow:0 0 0 1px rgba(28,27,24,.16); text-align:left; }
  .o2::before{ content:''; position:absolute; left:11px; top:-5px; width:10px; height:10px; border-radius:50%;
    background:var(--seal,#b43a2b); opacity:.8; }
  .o2 .eb{ display:block; font-size:8.5px; letter-spacing:.28em; text-transform:uppercase; color:rgba(28,27,24,.45); margin-bottom:3px; }
  .o2 .tk{ font-size:14.5px; }
  .o2 .foot{ display:flex; align-items:center; gap:8px; margin-top:9px; }

  /* 3 rail */
  .o3{ display:flex; align-items:stretch; }
  .o3 .bar{ width:3px; background:linear-gradient(rgba(180,58,43,.85), rgba(180,58,43,.15)); border-radius:99px; }
  .o3 .col{ padding:2px 0 0 12px; text-align:left; }
  .o3 .eb{ display:block; font-size:8.5px; letter-spacing:.28em; text-transform:uppercase; color:rgba(28,27,24,.45); }
  .o3 .tk{ display:block; font-size:16px; letter-spacing:.03em; margin:2px 0 7px; }
  .o3 .foot{ display:flex; align-items:center; gap:8px; }

  /* 4 plain */
  .o4{ text-align:right; }
  .o4 .eb{ display:block; font-size:8.5px; letter-spacing:.3em; text-transform:uppercase; color:rgba(28,27,24,.42); }
  .o4 .rowl{ display:flex; align-items:center; justify-content:flex-end; gap:9px; margin-top:3px; }
  .o4 .tk{ font-size:15.5px; letter-spacing:.03em; }
  .o4 .foot{ margin-top:6px; }
</style>
</head>
<body>
<h1>objective designs</h1>
<div class="hint">click a panel to complete the objective &middot; reward flies to the gold counter instead of hiding under the box</div>
<div class="row" id="row"></div>
<script>
const FISH = '<svg class="fish" viewBox="0 0 340 200"><path d="M310 100 Q180 10 30 148"/><path d="M310 100 Q180 190 30 52"/></svg>';
const OPTS = [
  { lab: '1 · quest banner', sub: 'seal-red spine, small OBJECTIVE eyebrow, reward chip on the right. reads like a quest log entry',
    html: `<div class="box o1"><span class="mark"></span><span class="col"><span class="eb">Objective</span><span class="tk strike">Buy an egg</span></span><span class="chip">+5 G</span></div>` },
  { lab: '2 · pinned tag', sub: 'paper slip pinned with a red dot, slightly askew. no border, no shadow',
    html: `<div class="box o2"><span class="eb">Objective</span><span class="tk strike">Buy an egg</span><span class="foot"><span class="mark"></span><span class="chip">+5 G</span></span></div>` },
  { lab: '3 · ink rail', sub: 'no panel at all, just a fading red rail holding the text. lightest touch',
    html: `<div class="box o3"><span class="bar"></span><span class="col"><span class="eb">Objective</span><span class="tk strike">Buy an egg</span><span class="foot"><span class="mark"></span><span class="chip">+5 G</span></span></span></div>` },
  { lab: '4 · bare HUD', sub: 'pure typography, right aligned, nothing behind it. most modern-game',
    html: `<div class="box o4"><span class="eb">Objective</span><span class="rowl"><span class="tk strike">Buy an egg</span><span class="mark"></span></span><span class="foot"><span class="chip">+5 G</span></span></div>` }
];
const row = document.getElementById('row');
for (const o of OPTS) {
  const d = document.createElement('div');
  d.className = 'opt';
  d.innerHTML = `<div class="stage"><div class="gold"><b>5</b><i>G</i></div>${FISH}<span class="tapme">click to complete</span>${o.html}</div>
    <div class="lab">${o.lab}</div><div class="sub">${o.sub}</div>`;
  row.appendChild(d);
  const stage = d.querySelector('.stage');
  const box = d.querySelector('.box');
  const chip = d.querySelector('.chip');
  const gold = d.querySelector('.gold');
  const html = o.html;
  stage.addEventListener('click', () => {
    if (box.classList.contains('done')) return;
    box.classList.add('done');
    const a = chip.getBoundingClientRect(), b = gold.getBoundingClientRect();
    setTimeout(() => {
      chip.style.transform = `translate(${b.left + 12 - a.left}px, ${b.top + 14 - a.top}px) scale(1.5)`;
      chip.style.opacity = '0';
    }, 420);
    setTimeout(() => { gold.querySelector('b').textContent = '10'; }, 1120);
    setTimeout(() => box.classList.add('gone'), 1250);
    setTimeout(() => {
      const fresh = document.createElement('div');
      fresh.innerHTML = html;
      box.replaceWith(fresh.firstChild);
      gold.querySelector('b').textContent = '5';
      const nb = stage.querySelector('.box');
      nb.addEventListener('click', e => e.stopPropagation());
      location.reload();
    }, 4200);
  });
}
</script>
</body>
</html>
