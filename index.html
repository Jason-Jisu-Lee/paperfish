<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>paperfish</title>
    <link rel="stylesheet" href="fonts/fonts.css?v=1" />
    <link rel="stylesheet" href="base.css?v=74" />
  </head>
  <body>
    <canvas id="sea"></canvas>

    <div class="goldbox" id="goldbox" hidden>
      <div class="gold"><span id="gold-num">0</span><span class="g">G</span></div>
      <div class="micro goldrate" id="gold-rate">+0 / min</div>
      <div class="goldsrc" id="goldsrc" hidden></div>
    </div>

    <div class="soulbox" id="soulbox" hidden>
      <div class="soul"><span id="soul-num">0</span><span class="soul-lab">SOUL</span></div>
      <button class="collect" id="collect-soul" hidden><i class="wisp"></i><i class="wisp"></i><i class="wisp"></i>Collect Soul</button>
    </div>

    <aside class="hud" id="hud" hidden>
      <div class="railwrap">
        <nav class="rail">
          <button class="rbtn on" data-cat="fish" aria-label="fish">
            <svg viewBox="0 0 24 24"><path d="M3 12 Q12 4.5 21 14.5" /><path d="M3 12 Q12 19.5 21 9.5" /></svg>
          </button>
          <button class="rbtn" data-cat="income" aria-label="income">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><rect x="9.8" y="9.8" width="4.4" height="4.4" rx=".5" /></svg>
          </button>
          <button class="rbtn" data-cat="food" id="rail-food" aria-label="food" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 21.5 C8.6 17.4 8.4 13.2 9.6 9.6 C10.3 7.1 11.3 4.9 12.8 2.9 C14.5 5.2 15.1 8 14.6 10.9 C14.1 14.2 13.9 17.9 12 21.5 Z" /><path d="M12.1 19 C11.7 15.4 11.9 11.6 12.6 5.8" /></svg>
          </button>
          <button class="rbtn" data-cat="life" aria-label="life" hidden>
            <svg viewBox="0 0 24 24"><path d="M12 21 C12 18 12 16 12 13.5" /><path d="M12 13.5 C6.5 13.5 5 9.5 4.8 6.2 C9.8 6.6 11.8 9.8 12 13.5 Z" /><path d="M12 13.5 C16.2 13.2 17.6 10.4 18 7.6 C14.2 8 12.3 10.4 12 13.5 Z" /></svg>
          </button>
        </nav>
        <div class="railbody">
          <div class="ubgrid" id="fish-grid"></div>
          <div class="ubgrid" id="up-grid" hidden></div>
        </div>
      </div>
    </aside>

    <nav class="corner" id="corner" hidden>
      <button class="icon" id="music" aria-label="music">
        <svg viewBox="0 0 24 24">
          <circle class="note-head" cx="9.8" cy="16.6" r="2.1" />
          <path d="M11.9 16.6 V5.6" />
          <path d="M11.9 5.6 C14.6 6.4 15.8 8.2 15.2 10.8" />
          <path id="music-slash" d="M4.5 4.5 L19.5 19.5" hidden />
        </svg>
      </button>
      <button class="icon" id="screen" aria-label="screen">
        <svg viewBox="0 0 24 24">
          <g id="glyph-expand">
            <path d="M4.5 9 V4.5 H9" />
            <path d="M15 4.5 H19.5 V9" />
            <path d="M19.5 15 V19.5 H15" />
            <path d="M9 19.5 H4.5 V15" />
          </g>
          <g id="glyph-contract" hidden>
            <path d="M9 4.5 V9 H4.5" />
            <path d="M19.5 9 H15 V4.5" />
            <path d="M15 19.5 V15 H19.5" />
            <path d="M4.5 15 H9 V19.5" />
          </g>
        </svg>
      </button>
      <button class="icon" id="pause" aria-label="pause">
        <svg viewBox="0 0 24 24">
          <g id="glyph-pause">
            <path d="M9.2 5.5 V18.5" />
            <path d="M14.8 5.5 V18.5" />
          </g>
          <g id="glyph-play" hidden>
            <path d="M9 5.5 L18.5 12 L9 18.5 L9 5.5" />
          </g>
        </svg>
      </button>
      <button class="icon" id="settings" aria-label="settings">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="6.2" />
          <circle cx="12" cy="12" r="2.1" />
          <path d="M12 5.8 V3.2" />
          <path d="M12 18.2 V20.8" />
          <path d="M5.8 12 H3.2" />
          <path d="M18.2 12 H20.8" />
          <path d="M16.4 7.6 L18.2 5.8" />
          <path d="M7.6 16.4 L5.8 18.2" />
          <path d="M16.4 16.4 L18.2 18.2" />
          <path d="M7.6 7.6 L5.8 5.8" />
        </svg>
      </button>
    </nav>

    <div class="modal" id="setmodal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <span>Settings</span>
          <button class="modal-x" id="set-x">×</button>
        </div>
        <div class="set-row">
          <span>Sound</span>
          <button class="toggle" id="set-sound"><span class="tknob"></span></button>
        </div>
        <div class="set-row">
          <span>Display</span>
          <div class="seg" id="set-display">
            <button data-d="win">Windowed</button>
            <button data-d="less">Borderless</button>
            <button data-d="full">Fullscreen</button>
          </div>
        </div>
        <div class="set-row" id="set-menu-row" hidden>
          <span>Quit</span>
          <button class="btn small" id="set-menu">Main Menu</button>
        </div>
        <div class="set-row">
          <span>Reset Progress</span>
          <button class="btn danger small" id="front-reset">Reset</button>
        </div>
      </div>
    </div>

    <div class="modal" id="confirm" hidden>
      <div class="modal-card confirm-card">
        <div class="confirm-text">Reset all progress?<br>This cannot be undone.</div>
        <div class="confirm-btns">
          <button class="btn" id="confirm-no">Cancel</button>
          <button class="btn danger" id="confirm-yes">Reset</button>
        </div>
      </div>
    </div>

    <section class="prestige" id="prestige" hidden>
      <div class="pr-wisps"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pr-inner">
        <div class="pr-title">Prestige</div>
        <div class="pr-souls"><span id="p-bank">0</span><span class="pr-lab">SOUL</span></div>
        <nav class="pr-tabs" id="p-tabs">
          <button data-tab="up" class="on">Upgrades</button>
          <button data-tab="tier">Tiers</button>
          <button data-tab="index">Fish Index</button>
        </nav>
        <div id="p-list"></div>
      </div>
      <button class="pr-dive" id="p-dive">Start</button>
      <div class="pctip" id="pctip" hidden></div>
    </section>

    <div class="modal" id="egginfo-modal" hidden>
      <div class="modal-card egginfo-card">
        <div class="modal-head">
          <span>Egg Tiers</span>
          <button class="modal-x" id="ei-x">×</button>
        </div>
        <div id="ei-body"></div>
      </div>
    </div>

    <div class="tutdim" id="tut-dim" hidden></div>
    <div class="tutbox" id="tutbox" hidden>
      <div class="tut-text" id="tut-text"></div>
      <button class="btn small" id="tut-next">Next</button>
    </div>

    <div class="objbox" id="objbox" hidden>
      <div class="obj-row">
        <span class="obj-mark">
          <svg viewBox="0 0 24 24">
            <circle class="ring" cx="12" cy="12" r="9.5"/>
            <path class="tick" d="M7.4 12.3 L10.5 15.3 L16.6 8.7"/>
          </svg>
        </span>
        <span class="obj-text" id="obj-text"></span>
        <span class="obj-count" id="obj-count" hidden></span>
      </div>
      <span class="obj-reward" id="obj-reward"></span>
    </div>

    <div class="saybox" id="saybox"></div>

    <div class="tip" id="fishtip" hidden>
      <span class="tip-name" id="fishtip-name"></span>
      <span class="tip-stage" id="fishtip-stage"></span>
    </div>
    <div class="tip" id="uptip" hidden></div>

    <div class="fishcard" id="fishcard" hidden>
      <button class="fc-x" id="fc-x">&times;</button>
      <div class="fc-art">
        <span class="fc-seal" id="fc-tier">1</span>
        <span class="fc-pic" id="fc-pic"></span>
      </div>
      <div class="fc-body">
        <div class="fc-name" id="fc-name"></div>
        <div class="fc-meta">
          <span class="fc-stage" id="fc-stage"></span>
          <span class="fc-age" id="fc-age"></span>
        </div>
        <div class="fc-bar"><i id="fc-fill"></i></div>
        <div class="fc-row" id="fc-freq-row">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><rect x="9.8" y="9.8" width="4.4" height="4.4" rx=".5"/></svg>
          <span>Income</span><b class="fcg" id="fc-freq"></b>
        </div>
        <div class="fc-row" id="fc-death-row" data-hint>
          <svg viewBox="0 0 24 24"><path d="M12 3.4 C15.6 8.2 18.2 11.2 18.2 14.4 C18.2 17.8 15.4 20.4 12 20.4 C8.6 20.4 5.8 17.8 5.8 14.4 C5.8 11.2 8.4 8.2 12 3.4 Z"/></svg>
          <span>Soul(s)</span><b class="fcs" id="fc-death"></b>
        </div>
        <div class="fc-row" id="fc-hatch-row" hidden>
          <svg viewBox="-26 -32 52 64"><path d="M0,-24 C13,-24 19,-9 19,3 C19,17 10,25 0,25 C-10,25 -19,17 -19,3 C-19,-9 -13,-24 0,-24"/></svg>
          <span>Hatches in</span><b id="fc-hatch"></b>
        </div>
      </div>
    </div>

    <div class="veil" id="veil" hidden>
      <div class="veil-mid">
        <svg viewBox="0 0 24 24">
          <path d="M9 5 V19" />
          <path d="M15 5 V19" />
        </svg>
        <div class="micro">paused</div>
      </div>
    </div>

    <div class="smallveil" id="smallveil" hidden>
      <div>
        <div class="sv-title">Your screen is too small for the fish!</div>
        <div class="micro">Please adjust the window size.</div>
      </div>
    </div>

    <section class="front" id="front">
      <nav class="corner front-corner">
        <button class="icon brand steam" id="steam" aria-label="steam">
          <svg viewBox="0 0 24 24">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0zM7.54 18.21l-1.473-.61c.262.543.714.999 1.314 1.25 1.297.539 2.793-.076 3.332-1.375.263-.63.264-1.319.005-1.949-.26-.63-.75-1.121-1.377-1.383-.624-.26-1.29-.249-1.878-.03l1.523.63c.956.4 1.409 1.5 1.009 2.455-.397.957-1.497 1.41-2.454 1.012zm11.415-9.303c0-1.662-1.353-3.015-3.015-3.015-1.665 0-3.015 1.353-3.015 3.015 0 1.665 1.35 3.015 3.015 3.015 1.663 0 3.015-1.35 3.015-3.015zm-5.273-.005c0-1.252 1.013-2.266 2.265-2.266 1.249 0 2.266 1.014 2.266 2.266 0 1.251-1.017 2.265-2.266 2.265-1.253 0-2.265-1.014-2.265-2.265z" />
          </svg>
        </button>
        <button class="icon brand discord" id="discord" aria-label="discord">
          <svg viewBox="0 0 24 24">
            <path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189z" />
          </svg>
        </button>
      </nav>
      <div class="front-mid">
        <div class="f-title">paperfish<span class="tseal"></span></div>
        <div class="hero-wrap">
          <svg class="hero" viewBox="0 0 340 200" aria-label="fish drawn in ink">
            <path class="body" d="M30,100 Q160,10 310,148" />
            <path class="body" d="M30,100 Q160,190 310,52" />
            <path class="wash" d="M34,106 Q160,22 306,150" />
            <path class="wash" d="M34,94 Q160,178 306,50" />
          </svg>
          <div class="pool"></div>
        </div>
        <nav class="menu">
          <button id="m-play">play</button>
          <button id="m-settings">settings</button>
        </nav>
      </div>

      <div class="fcredit">
        <div class="f-seal" aria-hidden="true">
          <svg viewBox="0 0 340 200">
            <path d="M30,100 Q160,10 310,148" />
            <path d="M30,100 Q160,190 310,52" />
          </svg>
        </div>
        <span>by 2ndIntelligentWorld</span>
      </div>
    </section>

    <div class="dev" id="dev">
      <div class="panel-label">dev</div>
      <div class="dev-row">
        <span class="dev-tag">speed</span>
        <button data-speed="1" class="on">1</button>
        <button data-speed="5">5</button>
        <button data-speed="20">20</button>
        <button data-speed="60">60</button>
      </div>
      <div class="dev-row">
        <span class="dev-tag">gold</span>
        <button data-gold="100">+100</button>
        <button data-gold="1000">+1k</button>
        <button data-gold="10000">+10k</button>
      </div>
      <div class="dev-row">
        <span class="dev-tag">eggs</span>
        <button data-act="hatch">hatch</button>
      </div>
      <div class="dev-row">
        <span class="dev-tag">soul</span>
        <button data-act="soul">+1</button>
      </div>
      <div class="dev-row">
        <span class="dev-tag">save</span>
        <button data-act="reset">reset</button>
      </div>
    </div>

    <script src="data/species.js?v=4"></script>
    <script src="data/content.js?v=11"></script>
    <script src="core/state.js?v=24"></script>
    <script src="world/stage.js?v=18"></script>
    <script src="world/ambience.js?v=6"></script>
    <script src="world/ocean.js?v=7"></script>
    <script src="ui/tut.js?v=4"></script>
    <script src="ui/panel.js?v=18"></script>
    <script src="ui/pause.js?v=1"></script>
    <script src="ui/confirm.js?v=1"></script>
    <script src="ui/obj.js?v=21"></script>
    <script src="ui/soul.js?v=14"></script>
    <script src="ui/say.js?v=1"></script>
    <script src="ui/detail.js?v=16"></script>
    <script src="ui/dev.js?v=2"></script>
    <script src="ui/front.js?v=6"></script>
    <script src="core/sim.js?v=17"></script>
    <script src="core/main.js?v=12"></script>
    <script src="ui/corner.js?v=3"></script>
  </body>
</html>
