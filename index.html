<html lang="en">
<head>

<canvas id="c"></canvas>
<div id="hud">
  <div id="depthlabel"></div>
  <div id="count"></div>
  <button id="indexbtn">index</button>
  <button id="resetbtn">reset</button>
</div>

  <div id="offerwant"></div>
  <div id="offerget"></div>
  <div class="row"><button id="deal">deal</button><button id="pass">pass</button></div>
</div>

  <div id="endindex"></div>

</div>
